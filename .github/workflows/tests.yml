name: tests

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip numpy pytest
      - name: Unit tests
        env:
          PYTHONPATH: .
        run: python -m pytest tests -q
      - name: Offline end-to-end loop (mock agent, no network)
        env:
          PYTHONPATH: .
        run: |
          python -m dream_rsi.cli loop --run /tmp/ci --task circle_packing \
            --agent mock --rounds 1 --workers 2 --k1 6 --versions 1 --betas 0.5 \
            --k2 8 --hard-branch 2 --hard-refine 1
      - name: Privacy sweep
        run: python3 privacy_sweep.py
